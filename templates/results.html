<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Optimization Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    .card {
        background-color: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        margin: 8px;
    }
    .container {
        display: flex;
        flex-wrap: wrap;
    }
    </style>
</head>
<body>
    <div class="container">
    {% for algorithm, task_lists in results.items() %}
        <div class="card">
            <h2>{{ algorithm }} </h2>
                <ul>
                    {% for task in task_lists.scheduled %}
                        <li>{{ task }}</li>
                    {% endfor %}
                    {% for task in task_lists.unscheduled %}
                        <li><s>{{ task }}</s></li>
                    {% endfor %}
                </ul>
        </div>

    {% endfor %}
    </div>
    <h2>Score Card</h2>
    <div class="container">
        {{ scorecard }}
    </div>
    <p>Note: Red: ⚠ Over budget </p>
</body>
</html>
